<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>Contador de Estoque</title>
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<script type="module" src="shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: app de almoxarifado escuro, igual ao do Base44 — topo com seletor de estoque, telas em cartões, menu fixo embaixo */
:root{
  --bg:#0F172A; --band:#020617; --card:#151F35; --card2:#1B2740; --line:#2A3752;
  --ink:#F1F5F9; --muted:#94A3B8; --field:#FFFFFF; --field-ink:#0F172A;
  --blue:#3B82C4; --green:#4A9E52; --red:#DC4C3E; --amber:#E8A13A; --okbg:#173A2A; --ok:#5BD08A;
  --f-head:"Arial Black","Archivo Black",Arial,sans-serif;
  --f-body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:720px;margin:0 auto}
svg.i{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px}
.bar .back{background:none;border:0;padding:6px;margin-left:-6px;display:grid;place-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:19px;letter-spacing:.01em;flex:1;min-width:0}
.brand svg{color:var(--blue)}
.st{font-family:var(--f-head);font-size:12px;padding:6px 10px;border-radius:6px;background:var(--okbg);color:var(--ok);display:flex;gap:6px;align-items:center;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.off{background:#3A1B1B;color:#F08A80}
.ib{width:44px;height:44px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib.on{background:var(--card2)}
.ib.adm{color:var(--blue)}
.selwrap{background:var(--band);padding-block:12px 14px}
.selwrap label{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.sel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px;font-weight:700;font-size:16px}

main{display:flex;flex-direction:column;gap:16px;padding-block:18px}
h2.title{margin:0;font-family:var(--f-head);font-size:26px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
h2.title svg{color:var(--blue);width:28px;height:28px}
.lead{margin:-8px 0 0;color:var(--muted)}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.warn{border-color:var(--amber)}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--f-head);font-size:16px;text-transform:uppercase}
.ch svg{width:20px;height:20px;color:var(--blue)}
.ch .r{margin-left:auto;font-family:var(--f-body);font-size:13px;color:var(--muted);text-transform:none}
.ch .tag{margin-left:auto;font-family:var(--f-body);font-weight:700;font-size:12px;padding:4px 8px;border-radius:5px;background:var(--okbg);color:var(--ok);text-transform:none}
.cb{padding:16px;display:flex;flex-direction:column;gap:12px}
.cb p{margin:0;color:var(--muted)}

.hero .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.hero h3{margin:2px 0 4px;font-family:var(--f-head);font-size:30px;text-transform:uppercase;line-height:1.05}
.hero .act{background:var(--band);padding:16px}

.btn{border:0;border-radius:8px;padding:14px 16px;font-family:var(--f-head);font-size:15px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;color:#fff}
.btn.big{padding:20px;font-size:19px}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.red{background:var(--red)}
.btn.dark{background:var(--band);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.sm{padding:10px 12px;font-size:13px;width:auto}
.btn[disabled]{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:30px;height:30px}
.tile b{font-family:var(--f-head);font-size:17px;text-transform:uppercase;margin-top:6px}
.tile span{color:var(--muted);font-size:14px}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.inp{background:var(--field);color:var(--field-ink);border:0;border-radius:8px;padding:13px 14px;width:100%;min-width:0;font-size:16px}
.inp::placeholder{color:#94A3B8}
.inp[readonly]{background:#E2E8F0}
select.inp{appearance:auto}
.inline{display:flex;gap:8px;align-items:stretch}
.inline .inp{flex:1}
.hint{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

/* listas */
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list>.it:first-child{border-top:0}
.it .nm{min-width:0;display:flex;flex-direction:column;gap:3px}
.it .nm b{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted)}
.meta .c{font-family:var(--f-mono)}
.q{text-align:right;line-height:1.1}
.q strong{font-family:var(--f-mono);font-size:20px;font-weight:700}
.q small{display:block;font-size:11px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;text-transform:uppercase}
.pill.v{background:#3A2A12;color:var(--amber)} .pill.z{background:#3A1B1B;color:#F08A80} .pill.x{background:#3A1B1B;color:#F08A80}
.empty{padding:22px 16px;color:var(--muted)}
.search{position:relative}
.search .inp{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748B;width:18px;height:18px}

.cnt{width:92px;background:var(--field);color:var(--field-ink);border:2px solid transparent;border-radius:8px;padding:9px 6px;text-align:center;font-family:var(--f-mono);font-size:18px}
.cnt.d{border-color:var(--amber)}
.dn{font-family:var(--f-mono);font-size:12px;text-align:right;margin-top:4px;color:var(--muted)}
.dn.p{color:var(--ok)} .dn.n{color:#F08A80}
.cbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.cbar p{margin:0}
.cbar b{font-family:var(--f-head)}

.mv{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.mv .d{font-family:var(--f-mono);font-weight:700}
.mv .d.p{color:var(--ok)} .mv .d.n{color:#F08A80} .mv .d.z{color:var(--muted)}
.mv time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mv span{min-width:0;overflow-wrap:anywhere}

.person{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.person:first-child{border-top:0}
.person .who{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.person b{font-weight:700;overflow-wrap:anywhere}
.person small{color:var(--muted);display:block}

/* menu inferior */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--band);border-top:1px solid var(--line);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.bn .inner{display:grid;grid-template-columns:repeat(6,1fr)}
nav.bn button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--muted);font-family:var(--f-head);font-size:10px;text-transform:uppercase;min-width:0}
nav.bn button.on{color:var(--blue)}
nav.bn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* folha */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-head);font-size:22px;text-transform:uppercase;overflow-wrap:anywhere}
.sheet .sub{margin:-8px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:8px}
.big strong{font-family:var(--f-mono);font-size:44px;line-height:1}
.big span{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--band);border-radius:8px;padding:12px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere;text-align:right}
.note{border-radius:8px;padding:12px;font-size:14px}
.note.a{background:#3A2A12;color:#F6C77A} .note.r{background:#3A1B1B;color:#F6AFA8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:380px){.tile{padding:12px}.btn.big{font-size:16px}}
/* endereçamento 3D */
#mapa{position:fixed;left:0;right:0;z-index:15;background:#C9D3DE}
#mstage{position:absolute;inset:0;touch-action:none}
#mstage canvas{display:block}
#mstage .empty{color:#334155}
#mhud{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#mhud > *{pointer-events:auto}
.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mchip{background:rgba(21,31,53,.94);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.15;text-align:left;color:var(--ink)}
.mchip b{font-family:var(--f-mono);font-size:15px} .mchip span{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.mchip.w b{color:var(--amber)} .mchip.r b{color:#F08A80}
.msearch{flex:1 1 220px;max-width:380px}
.mseg{display:flex;background:rgba(21,31,53,.94);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mseg button,.mseg-tg{background:none;border:0;padding:9px 10px;font-family:var(--f-head);font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mseg button.on{background:var(--blue);color:#fff}
.mseg-tg{background:rgba(21,31,53,.94);border:1px solid var(--line);border-radius:10px}
.mseg-tg.on{color:#fff;border-color:var(--blue)}
.mres{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mres::-webkit-scrollbar{display:none}
.mres button{flex:0 0 auto;background:rgba(21,31,53,.94);border:1px solid var(--blue);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:12px}
.mres span{background:rgba(21,31,53,.94);border-radius:8px;padding:6px 10px;color:var(--muted)}
.mpick{background:var(--blue);color:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#mpanel{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;width:360px;max-width:calc(100% - 20px);max-height:58%;overflow:auto;background:rgba(21,31,53,.96);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:640px){#mpanel{left:max(10px,env(safe-area-inset-left,0px));width:auto;max-width:none}}
#mpanel .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#mpanel .code{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--blue)}
#mpanel h3{margin:2px 0 0;font-family:var(--f-head);font-size:18px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
#mpanel .x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px}
#mpanel .addr,.muted{font-size:12px;color:var(--muted);margin:0}
.mitem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--band);border-radius:8px;padding:10px 12px}
.mitem b{overflow-wrap:anywhere} .mitem small{display:block;color:var(--muted);font-size:12px}
.mitem .mbtns{grid-column:1/-1;display:flex;gap:6px}
.mitem .mbtns .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<header class="top">
  <div class="gut"><div class="inner bar" id="bar"></div></div>
  <div class="selwrap gut"><div class="inner"><label for="selEst">ESTOQUE</label><select id="selEst" class="sel"><option>Carregando…</option></select></div></div>
</header>
<div class="gut"><main class="inner" id="app"><div class="empty">Conectando ao estoque…</div></main></div>
<div id="mapa" hidden><div id="mstage"><div class="empty">Carregando maquete 3D…</div></div><div id="mhud"></div><aside id="mpanel" hidden></aside></div>
<nav class="bn" id="bn"><div class="inner"></div></nav>
<input type="file" accept="image/*" capture="environment" id="fCam" class="hidden-file" tabindex="-1" aria-hidden="true">
<input type="file" accept="image/*" id="fGal" class="hidden-file" tabindex="-1" aria-hidden="true">
<div id="layer"></div>

<script>
(() => {
/* ---------- ícones ---------- */
const P = {
  cube:'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/>',
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',

  food:'<path d="M5 3v7a2 2 0 0 0 4 0V3M7 10v11M17 21V3c-2 0-3.5 2-3.5 6s1.5 5 3.5 5"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

  img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  uplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/>',

  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-3-3 7.7-7.7M14.7 6.3 12 9 3 18l3 3 9-9"/>',

  sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'
};
const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- estado ---------- */
const S = { est:{}, itens:{}, movs:[], papeis:{}, pedidos:{}, prof:{}, sel:null, view:"home", sheet:null, cont:null, q:"",
  me:{id:null,email:"",name:"",owner:false}, ready:{est:false,it:false,pap:false}, online:navigator.onLine, pedidoFeito:false, searchHits:null };
let db=null, U=null, DL=null;

function movimenta(itemId,delta,tipo,extra={}){
  const it=S.itens[itemId];if(!it)return false;
  if(!podeMover()){toast("Seu acesso é só de consulta.");return false;}
  const saldo=Math.round(((Number(it.qtd)||0)+delta)*1000)/1000;

  const t=Date.now(), e=S.est[it.estoqueId]||{};

  it.hist=[{t,d:delta,s:saldo,tipo,...(extra.obs?{n:extra.obs}:{})},...(it.hist||[])].slice(0,25);
  render(); if(S.sheet)renderSheet();
  enfileira(itemId,()=>db.doc("itens/"+itemId).update({qtd:saldo,hist:it.hist,atualizadoEm:t}));

}

/* ---------- leitura de QR ---------- */
let scanCtx=null;
function lerFoto(ctx,galeria){scanCtx=ctx;const f=galeria?$("#fGal"):$("#fCam");f.value="";}
const camBtn=(ctx,cls,txt,gal)=>podeMover()
  ? (window.__standalone&&!gal&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia
    ? `<button class="btn ${cls}" data-live="${ctx}">${ic("cam")}${txt}</button>`
    : `<label for="${gal?"fGal":"fCam"}" class="btn ${cls}" data-${gal?"scan-gal":"scan"}="${ctx}" role="button">${ic(gal?"img":"cam")}${txt}</label>`)
  : `<button class="btn ${cls}" disabled>${ic(gal?"img":"cam")}${txt}</button>`;
function carregaImg(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
async function decodifica(file){
  // 1) leitor nativo do celular (lê QR e código de barras)
  if("BarcodeDetector" in window){
    try{const bd=new BarcodeDetector();const src=await createImageBitmap(file);const r=await bd.detect(src);
      if(r&&r.length){const q=r.find(x=>x.format==="qr_code")||r[0];return q.rawValue.trim();}}catch(e){}
  }
  // 2) jsQR em vários tamanhos e recortes (centro, metades)
  if(!window.jsQR)return null;
  const im=await carregaImg(file);const W=im.naturalWidth,H=im.naturalHeight;
  const crops=[[0,0,1,1],[.15,.15,.7,.7],[0,0,1,.6],[0,.4,1,.6],[.25,.25,.5,.5]];
  try{
    for(const [x,y,w,h] of crops){for(const max of [1200,800,1800]){
      const sw=W*w,sh=H*h,sc=Math.min(1,max/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
      const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(im,W*x,H*y,sw,sh,0,0,c.width,c.height);
      const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});
      if(r&&r.data)return r.data.trim();
    }}
  }finally{URL.revokeObjectURL(im.src);}
  return null;
}
async function onFile(ev){
  const file=ev.target.files&&ev.target.files[0];if(!file)return;
  const ctx=scanCtx||"digitalizar";
  toast("Lendo código…");
  let code=null;
  try{code=await decodifica(file);}catch(e){}
  if(!code){openSheet({kind:"semqr",ctx});return;}
  if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
  resolveCodigo(code,ctx);
}
function resolveCodigo(code,ctx){
  const aqui=itensDe(S.sel).find(i=>i.qr===code||i.codigo===code);
  const fora=Object.values(S.itens).find(i=>(i.qr===code||i.codigo===code)&&i.estoqueId!==S.sel);
  if(ctx==="contagem"){
    if(!aqui){toast("Esse QR não está cadastrado neste estoque.");return;}
    if(!S.cont)S.cont={};const v=toNum(S.cont[aqui.id]);S.cont[aqui.id]=String((isNaN(v)?0:v)+1);render();toast(`${aqui.nome}: contado ${S.cont[aqui.id]}`);return;
  }
  if(ctx==="retirar"||ctx==="mover"){ if(!aqui){toast("Esse QR não está neste estoque.");return;} openSheet({kind:ctx,id:aqui.id});return;}
  if(ctx==="consumir"){const e=est01();const i=e&&itensDe(e.id).find(x=>x.qr===code||x.codigo===code);if(!i){toast("Esse QR não está no Estoque 01.");return;}openSheet({kind:"consumir",id:i.id});return;}
  if(aqui)openSheet({kind:"scan",id:aqui.id});
  else if(fora)openSheet({kind:"fora",code,id:fora.id});
  else openSheet({kind:"form",qr:code});
}

/* ---------- câmera ao vivo (só fora do Claude) ---------- */
let live=null;
function liveStop(){if(live){live.stop=true;try{live.stream&&live.stream.getTracks().forEach(t=>t.stop());}catch(e){}live=null;}const el=$("#liveBox");if(el)el.remove();}
async function liveStart(ctx){
  liveStop();
  const box=document.createElement("div");box.id="liveBox";box.className="scrim";
  box.innerHTML=`<div class="sheet" role="dialog" aria-label="Câmera"><h3>Aponte para o QR</h3><video id="liveV" playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:45vh;object-fit:cover"></video><p class="sub" id="liveMsg">Abrindo câmera…</p><div class="inline"><input id="liveCode" class="inp" placeholder="Ou digite o código" autocomplete="off"><button class="btn green sm" data-live-ok>OK</button></div><button class="btn line" data-live-x>Fechar</button></div>`;
  document.body.appendChild(box);
  const st=live={ctx,stop:false,stream:null};const msg=t=>{const m=$("#liveMsg");if(m)m.textContent=t;};
  try{st.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});}
  catch(e){msg("Não consegui abrir a câmera. Permita o acesso à câmera no navegador ou use a foto.");return;}
  if(st.stop){st.stream.getTracks().forEach(t=>t.stop());return;}
  const v=$("#liveV");v.srcObject=st.stream;try{await v.play();}catch(e){}
  msg(ctx==="contagem"?"Cada leitura soma +1 na contagem.":"Procurando QR…");
  const bd="BarcodeDetector" in window?new BarcodeDetector():null;
  const cv=document.createElement("canvas"),g=cv.getContext("2d",{willReadFrequently:true});let pausa=0;
  const tick=async()=>{
    if(st.stop)return;
    if(Date.now()>pausa&&v.videoWidth){
      let code=null;
      try{
        if(bd){const r=await bd.detect(v);if(r&&r.length)code=r[0].rawValue.trim();}
        else if(window.jsQR){const sc=Math.min(1,720/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);g.drawImage(v,0,0,cv.width,cv.height);
          const r=jsQR(g.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"dontInvert"});if(r&&r.data)code=r.data.trim();}
      }catch(e){}
      if(code){
        if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
        if(ctx==="contagem"){pausa=Date.now()+1600;resolveCodigo(code,ctx);}
        else{liveStop();resolveCodigo(code,ctx);return;}
      }
    }
    setTimeout(tick,160);
  };
  tick();
}

  if(!papel()){app.innerHTML=vAguardando();return;}
  const lista=estOrd();
  if(!lista.length&&S.view!=="config"){app.innerHTML=vSemEstoque();return;}
  if(!S.sel||!S.est[S.sel])S.sel=(est01()||lista[0]).id;
  const fa=document.activeElement,fid=fa&&fa.id,selr=fa&&fa.selectionStart!=null?[fa.selectionStart,fa.selectionEnd]:null;
  if(S.view==="mapa"){app.innerHTML="";if($("#mapa").hidden)MAP.show();else MAP.refresh();return;}
  const V={home:vHome,digitalizar:vDigit,contagem:vContagem,retirar:()=>vLista("retirar"),mover:()=>vLista("mover"),consumir:()=>vLista("consumir"),produtos:vProdutos,estoques:vEstoques,adm:vAdm,config:vConfig}[S.view]||vHome;

  if(S.view==="adm")carregaPerfis();
}

function vProdutos(){

    <div class="person"><span class="hint">${ic("wrench")}Visualizador = só consulta. Operador = pode movimentar o estoque.</span></div></section>`;

/* ---------- folhas ---------- */
function openSheet(s){S.sheet=s;renderSheet();}
function closeSheet(){S.sheet=null;$("#layer").innerHTML="";}
function kvItem(i){
  const e=S.est[i.estoqueId]||{};
  const rows=[["Endereço",i.endereco],["Produto",i.codigo],["Q.P.",i.qp],["Lote",i.lote],["Qtd/Cx",i.qtdCx],["Liberador",i.liberador],["Fabricação",dBR(i.dtFab)],["Validade",dBR(i.dtVal)],["QR",i.qr]];
  (e.campos||[]).forEach(c=>{let v=(i.extras||{})[c.id];if(c.tipo==="data")v=dBR(v);rows.push([c.nome,v]);});
  return `<dl class="kv">${rows.filter(r=>r[1]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}
function qtyBox(id,lbl){return `<div class="field"><label for="${id}">${lbl}</label><input id="${id}" class="inp num" inputmode="decimal" value="1" style="text-align:center;font-size:22px"></div>`;}
function renderSheet(){
  const L=$("#layer"),s=S.sheet;if(!s){L.innerHTML="";return;}
  const i=s.id?S.itens[s.id]:null;let h="";
  const top=i?`<h3>${esc(i.nome)}</h3><p class="sub">${esc(estNome(S.est[i.estoqueId]))}</p><div class="big"><strong>${fmt(i.qtd)}</strong><span>em estoque</span></div>`:"";
  if(["scan","item","retirar","consumir","mover"].includes(s.kind)&&!i){closeSheet();return;}
  if(s.kind==="scan"){
    h=`${top}<p class="sub" style="margin:0">Caixa já cadastrada. O que fazer?</p>
      <div class="row2"><button class="btn green" data-act="mais1">${ic("plus")}Adicionar 1</button><button class="btn red" data-act="menos1">Remover 1</button></div>
      <button class="btn dark" data-act="editItem">Editar manualmente</button>
      <div class="field"><label for="mq">Outra quantidade</label><div class="inline"><input id="mq" class="inp num" inputmode="decimal" placeholder="Ex.: 12"><button class="btn green sm" data-act="maisN">+</button><button class="btn red sm" data-act="menosN">−</button></div></div>
      <button class="btn line" data-act="fechar">Fechar</button>`;
  }
  if(s.kind==="item"){
    h=`${top}${kvItem(i)}
      ${podeMover()?`<div class="row2"><button class="btn green" data-act="mais1">${ic("plus")}Adicionar 1</button><button class="btn red" data-act="menos1">Remover 1</button></div>
      <div class="field"><label for="mq">Outra quantidade</label><div class="inline"><input id="mq" class="inp num" inputmode="decimal" placeholder="Ex.: 12"><button class="btn green sm" data-act="maisN">+</button><button class="btn red sm" data-act="menosN">−</button><button class="btn dark sm" data-act="ajusta">=</button></div></div>
      <div class="row2"><button class="btn dark" data-act="editItem">Editar</button><button class="btn dark" data-act="paraMover">${ic("move")}Mover</button></div>`:""}
      ${est01()&&i.estoqueId===est01().id?`<button class="btn blue" data-act="mapaItem">${ic("grid")}${MAP.valido(i.endereco)?"Ver no mapa ("+esc(i.endereco)+")":podeMover()?"Endereçar no mapa":"Sem endereço"}</button>`:""}
      <div class="card" style="border-radius:8px"><div class="ch" style="font-size:13px">${ic("clock")}Últimas movimentações</div>${(i.hist||[]).map(x=>`<div class="mv"><span class="d ${x.d>0?"p":x.d<0?"n":"z"}">${x.d>0?"+":""}${fmt(x.d)}</span><span>${esc({entrada:"Entrada",saida:"Retirada",consumo:"Consumo",contagem:"Contagem",ajuste:"Ajuste",inicial:"Cadastro",transf_saida:"Transferência (saída)",transf_entrada:"Transferência (entrada)",endereco:"Endereço "+(x.n||"")}[x.tipo]||x.tipo)}${x.tipo==="endereco"?"":" · saldo "+fmt(x.s)}</span><time>${when(x.t)}</time></div>`).join("")||`<div class="empty">Sem movimentações.</div>`}</div>
      <button class="btn line" data-act="fechar">Fechar</button>`;
  }
  if(s.kind==="retirar"||s.kind==="consumir"){
    h=`${top}${qtyBox("rq",s.kind==="consumir"?"Quantidade consumida":"Quantidade a retirar")}
      <div class="field"><label for="robs">Observação (opcional)</label><input id="robs" class="inp" placeholder="Destino, pedido, responsável…"></div>
      <div class="row2"><button class="btn line" data-act="fechar">Cancelar</button><button class="btn red" data-act="confRetira">${s.kind==="consumir"?"Consumir":"Retirar"}</button></div>`;
  }
  if(s.kind==="mover"){
    const outros=estOrd().filter(e=>e.id!==i.estoqueId);
    h=`${top}${qtyBox("rq","Quantidade a mover")}
      <div class="field"><label for="dest">Para o estoque</label><select id="dest" class="inp">${outros.map(e=>`<option value="${esc(e.id)}">${esc(estNome(e))}</option>`).join("")}</select></div>
      ${outros.length?"":`<div class="note a">Crie outro estoque para poder mover.</div>`}
      <div class="row2"><button class="btn line" data-act="fechar">Cancelar</button><button class="btn blue" data-act="confMove" ${outros.length?"":"disabled"}>${ic("move")}Mover</button></div>`;
  }
  if(s.kind==="fora"){
    const f=S.itens[s.id];
    h=`<h3>QR em outro estoque</h3><div class="note a">Esta caixa (${esc(f.nome)}) está cadastrada em <b>${esc(estNome(S.est[f.estoqueId]))}</b>, com saldo ${fmt(f.qtd)}.</div>
      <button class="btn blue" data-act="irPara">Abrir no ${esc(S.est[f.estoqueId]?.chave||"")}</button>
      <button class="btn dark" data-act="paraMoverFora">${ic("move")}Mover para o estoque atual</button>
      <button class="btn line" data-act="cadastraAqui">Cadastrar também neste estoque</button>`;
  }
  if(s.kind==="form"){
    const base=s.id?S.itens[s.id]:(s.copia?{...S.itens[s.copia],qtd:0}:{qr:s.qr||""});
    const e=S.est[s.id?base.estoqueId:S.sel]||{};
    const f=(id,lbl,v,extra="")=>`<div class="field"><label for="${id}">${lbl}</label><input id="${id}" class="inp" value="${esc(v||"")}" ${extra}></div>`;
    h=`<h3>${s.id?"Editar caixa":"Nova caixa"}</h3><p class="sub">${esc(estNome(e))}</p>
      <form id="fItem" class="field" style="gap:12px">
        ${f("iNome","Nome do produto *",base.nome,'required placeholder="Como está na etiqueta"')}
        <div class="row2">${f("iCod","Produto (código)",base.codigo)}${f("iQp","Q.P.",base.qp)}</div>
        <div class="row2">${f("iLote","Lote",base.lote)}${f("iQcx","Qtd/Cx",base.qtdCx,'inputmode="decimal"')}</div>
        ${f("iLib","Liberador",base.liberador)}
        <div class="row2">${f("iFab","Dt. fabricação",base.dtFab,'type="date"')}${f("iVal","Dt. validade",base.dtVal,'type="date"')}</div>
        ${f("iQr","QR code",base.qr,s.qr?"readonly":'placeholder="Opcional"')}
        ${est01()&&(s.id?base.estoqueId:S.sel)===est01().id?f("iEnd","Endereço",base.endereco,'list="dlEnd" placeholder="Ex.: A-01-1-1 (opcional)" autocapitalize="characters"')+`<datalist id="dlEnd">${MAP.CODES.map(c=>`<option value="${c}">`).join("")}</datalist>`:""}
        ${(e.campos||[]).map(c=>f("x-"+c.id,c.nome,(base.extras||{})[c.id],c.tipo==="data"?'type="date"':c.tipo==="numero"?'inputmode="decimal"':"")).join("")}
        ${s.id?"":f("iQtd","Quantidade inicial","",'inputmode="decimal" placeholder="0"')}
        <div class="row2"><button type="button" class="btn line" data-act="fechar">Cancelar</button><button class="btn green" type="submit">${ic("check")}Salvar</button></div>
      </form>
      ${s.id?(s.confirm?`<div class="note r">Excluir esta caixa e o histórico dela? Não dá para desfazer.</div><div class="row2"><button class="btn dark" data-act="naoExclui">Manter</button><button class="btn red" data-act="simExcluiItem">Excluir</button></div>`:`<button class="btn red" data-act="pedeExcluiItem">${ic("trash")}Excluir caixa</button>`):""}`;
  }
  if(s.kind==="semqr"){
    h=`<h3>Não consegui ler</h3><div class="note a">A foto não mostrou um QR legível. Chegue a uns 15 cm, deixe o código ocupar boa parte da tela, evite reflexo e sombra.</div>
      ${camBtn(s.ctx,"blue","Tentar de novo")}
      <form id="fCode2" class="field"><label for="code2">Ou digite o código</label><div class="inline"><input id="code2" class="inp" placeholder="QR ou código do produto" autocomplete="off"><button class="btn green sm" type="submit">OK</button></div></form>
      <button class="btn line" data-act="fechar">Fechar</button>`;
  }
  if(s.kind==="revisao"){
    const its=itensDe(S.sel).filter(i=>!isNaN(toNum(S.cont[i.id])));const dif=its.filter(i=>toNum(S.cont[i.id])!==(Number(i.qtd)||0));
    h=`<h3>Revisar contagem</h3><p class="sub">${its.length} contados · ${dif.length} com divergência</p>
      <div class="card" style="border-radius:8px">${its.map(i=>{const n=toNum(S.cont[i.id]),d=n-(Number(i.qtd)||0);return `<div class="mv"><span class="d ${d>0?"p":d<0?"n":"z"}">${d===0?"=":(d>0?"+":"")+fmt(d)}</span><span>${esc(i.nome)}</span><span class="num" style="font-size:12px;color:var(--muted)">${fmt(i.qtd)}→${fmt(n)}</span></div>`;}).join("")}</div>
      <div class="row2"><button class="btn line" data-act="fechar">Voltar</button><button class="btn green" data-act="aplicaCont">Ajustar estoque</button></div>`;
  }
  if(s.kind==="excluiEst"){
    const e=S.est[s.id],n=itensDe(s.id).length;
    h=`<h3>Excluir estoque</h3><div class="note r">Excluir “${esc(estNome(e))}” e ${n} ${n===1?"caixa":"caixas"} dentro dele? Não dá para desfazer.</div>
      <div class="row2"><button class="btn dark" data-act="fechar">Manter</button><button class="btn red" data-act="simExcluiEst">Excluir</button></div>`;
  }
  L.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
  const fi=L.querySelector("#fItem");if(fi)fi.addEventListener("submit",salvaForm);
}

function salvaForm(ev){
  ev.preventDefault();const s=S.sheet;const v=id=>($("#"+id)?.value||"").trim();
  const nome=v("iNome");if(!nome)return;
  const eid=s.id?S.itens[s.id].estoqueId:S.sel, e=S.est[eid]||{};
  const extras={};(e.campos||[]).forEach(c=>{const x=v("x-"+c.id);if(x)extras[c.id]=x;});
  const base={nome,codigo:v("iCod"),qp:v("iQp"),lote:v("iLote"),qtdCx:v("iQcx"),liberador:v("iLib"),dtFab:v("iFab"),dtVal:v("iVal"),qr:v("iQr"),extras,endereco:$("#iEnd")?v("iEnd").toUpperCase():(s.id?(S.itens[s.id].endereco||""):"")};
  if(base.endereco&&!MAP.valido(base.endereco)){toast("Endereço inválido. Use o formato A-01-1-1 (rua A–D, prédio 01–06, nível 1–3, posição 1–2).");return;}

/* ---------- PLANILHA (Google Sheets via Apps Script) ---------- */
const PLAN=(()=>{
  const KEY="plFila1";let fila=[],busy=false,st={ok:null,msg:""};
  try{fila=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(fila.slice(-500)));}catch(e){}};
  const cfg=()=>S.plan&&S.plan.url&&S.plan.chave?S.plan:null;
  const who=()=>S.me.email||S.me.name||S.me.id||"";
  const movRow=(m,por)=>{const d=new Date(m.t);return [m.t+"-"+(m.itemId||"")+"-"+m.tipo,d.toLocaleDateString("pt-BR"),d.toLocaleTimeString("pt-BR"),m.tipo,m.estoque||"",m.nome||"",m.codigo||"",m.lote||"",m.qr||"",Number(m.delta)||0,Number(m.saldo)||0,m.obs||m.destino||m.origem||"",por];};
  const salRow=i=>{const e=S.est[i.estoqueId]||{};return [i.id,e.chave||"",i.endereco||"",i.nome||"",i.codigo||"",i.qp||"",i.lote||"",i.qtdCx||"",i.liberador||"",dBR(i.dtFab),dBR(i.dtVal),i.qr||"",Number(i.qtd)||0,i.atualizadoEm?new Date(i.atualizadoEm).toLocaleString("pt-BR"):""];};
  const setSt=(ok,msg)=>{st={ok,msg};if(S.view==="config")render();};
  async function post(body){
    const c=cfg();if(!c)throw new Error("Planilha não configurada.");
    let r;
    try{r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({chave:c.chave,...body}),redirect:"follow"});}
    catch(e){throw new Error("Não consegui falar com o Google (link errado, sem internet ou bloqueado neste ambiente).");}
    let j;try{j=await r.json();}catch(e){throw new Error("O Google respondeu algo inesperado. Confira se a implantação está como 'Qualquer pessoa'.");}
    if(!j.ok)throw new Error(j.erro==="chave"?"A chave não confere com a do script.":("Erro do script: "+(j.erro||"desconhecido")));
    return j;
  }
  async function flush(){
    if(busy||!cfg()||!fila.length)return;busy=true;
    try{
      while(fila.length){
        const lote=fila.slice(0,40),movs=[],sal={};
        lote.forEach(x=>{(x.movs||[]).forEach(m=>movs.push(m));(x.saldos||[]).forEach(r=>sal[r[0]]=r);});
        await post({movs,saldos:Object.values(sal)});
        fila.splice(0,lote.length);save();
      }
      setSt(true,"Enviado "+new Date().toLocaleTimeString("pt-BR"));
    }catch(e){setSt(false,e.message);}
    busy=false;
  }
  return {
    cfg,flush,pend:()=>fila.length,status:()=>st,post,
    registra(m,it){if(!cfg())return;fila.push({movs:[movRow(m,who())],saldos:[salRow(it)]});save();flush();},
    item(it){if(!cfg()||!podeMover())return;fila.push({saldos:[salRow(it)]});save();flush();},
    async tudo(){
      let docs=S.movs;try{const r=await db.collection("movs").orderBy("t","desc").limit(1000).get();docs=r.docs.map(d=>d.data());}catch(e){}
      const ids=[...new Set(docs.map(m=>m.por).filter(Boolean))];let pf={};try{if(U)pf=await U.profiles(ids);}catch(e){}
      const movs=docs.slice().reverse().map(m=>movRow(m,(pf[m.por]&&(pf[m.por].email||pf[m.por].name))||m.por||""));
      const saldos=Object.values(S.itens).map(salRow);
      const j=await post({movs,saldos,substituirSaldos:true});
      return {movs:j.movs,saldos:j.saldos};
    }
  };
})();

      ${podeMover()&&list.length?`<button class="btn blue" data-m="moverPal">${ic("move")}Mover palete para outro endereço</button>`:""}
      ${podeMover()&&sem.length?`<div class="field"><label for="mAdd">${list.length?"Adicionar ao palete um item sem endereço":"Guardar aqui um item sem endereço"} um item sem endereço</label><div class="inline"><select id="mAdd" class="inp">${sem.map(i=>`<option value="${i.id}">${esc(i.nome)}${i.lote?" · "+esc(i.lote):""}</option>`).join("")}</select><button class="btn green sm" data-m="guardaAqui">Guardar</button></div></div>`:""}
      ${!list.length&&!sem.length?`<p class="muted">Posição livre. Cadastre caixas em Digitalizar e endereçe aqui.</p>`:""}`;
    p.hidden=false;
  }
  function onClick(e){
    const b=e.target.closest("[data-m],[data-v],[data-pick],[data-tira],[data-go-slot]");if(!b)return;const d=b.dataset;
    if(d.v){vista(d.v);return;}
    if(d.goSlot){if(palPick||pick){toque(by[d.goSlot]);return;}S.sheetMapa=null;sel=by[d.goSlot];atualizaSel();foco(sel);painel();return;}
    if(d.pick){S.sheetMapa=null;pick=d.pick;sel=null;atualizaSel();hud();painel();toast("Toque na posição de destino");return;}
    if(d.tira){tirarEndereco(d.tira);return;}
    switch(d.m){
      case "sem":S.sheetMapa=S.sheetMapa==="sem"?null:"sem";sel=null;atualizaSel();painel();break;
      case "fecha":S.sheetMapa=null;sel=null;atualizaSel();painel();break;
      case "cancelaPick":pick=null;palPick=null;hud();break;
      case "moverPal":if(sel){palPick=sel.code;pick=null;S.sheetMapa=null;hud();painel();toast("Toque na posição de destino");}break;
      case "status":modoStatus=!modoStatus;cores();hud();break;
      case "guardaAqui":{const id=$("#mAdd").value;if(id&&sel)enderecar(id,sel.code);break;}
    }
  }
  function onInput(e){if(e.target.id==="mq"){q=e.target.value;marcaBusca();const pos=e.target.selectionStart;hud();const n=$("#mq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}}
  /* laço */
  function layout(){
    const top=$(".top").getBoundingClientRect().bottom,bot=$("#bn").getBoundingClientRect().height;
    const m=$("#mapa");m.style.top=top+"px";m.style.bottom=bot+"px";
    if(renderer){const st=$("#mstage"),w=st.clientWidth,h=st.clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}}
  }
  function loop(){
    requestAnimationFrame(loop);if(!running)return;
    const dt=Math.min(.05,clock.getDelta());
    if(fila.length){const a=fila[0];if(!a.run){const r=a.init();a.dur=a.acao?.001:r.dur*(a.sc||1);a.run=r.run;}a.t+=dt;const k=Math.min(1,a.t/a.dur);a.run(ease(k));if(k>=1){fila.shift();if(!fila.length)sync();}}
    if(voo){voo.t+=dt;const k=ease(Math.min(1,voo.t/.9));camera.position.lerpVectors(voo.p0,voo.p1,k);controls.target.lerpVectors(voo.t0,voo.t1,k);if(k>=1)voo=null;}
    if(marks.length){const o=.18+.2*(.5+.5*Math.sin(performance.now()/260));marks.forEach(m=>m.material.opacity=o);}
    controls.update();renderer.render(scene,camera);
  }
  function terminaAnim(){while(fila.length){const a=fila.shift();if(!a.run){const r=a.init();a.run=r.run;}a.run(1);}}
  let wired=false;
  return {
    CODES,valido,
    show(){
      const m=$("#mapa");m.hidden=false;layout();
      if(!wired){wired=true;m.addEventListener("click",onClick);m.addEventListener("input",onInput);addEventListener("resize",()=>{if(running)layout();});}
      hud();painel();
      if(!ready){carregar(()=>{if(init()){ready=true;running=true;layout();cores();sync();if(this._foco)this.focusItem(this._foco);}});}
      else{running=true;clock.getDelta();sync();layout();}
    },
    hide(){$("#mapa").hidden=true;if(running){terminaAnim();running=false;}},
    refresh(){if(!$("#mapa").hidden){sync();if(!(document.activeElement&&document.activeElement.id==="mq"))hud();if(!document.activeElement||!$("#mpanel").contains(document.activeElement))painel();}},
    focusItem(id){
      const it=S.itens[id];if(!it)return;
      if(!ready){this._foco=id;return;}this._foco=null;
      const s=by[(it.endereco||"").toUpperCase()];
      if(s){S.sheetMapa=null;sel=s;atualizaSel();foco(s);painel();}
      else if(podeMover()){pick=id;sel=null;atualizaSel();hud();painel();toast("Toque na posição para endereçar "+it.nome);}
    }
  };
})();

/* ---------- inicialização ---------- */
async function boot(){
  render();
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,U,DL]=await Promise.all([use("db"),use("user"),use("downloads")]);
  if(U){try{const m=await U.me();S.me={id:m.id||(await U.id()),email:m.email||"",name:m.name||"",owner:!!m.isOwner};}catch(e){}}
  if(!db){render();return;}
  const err=()=>{S.online=false;render();};
  db.collection("estoques").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]={...d.data(),id:d.id});S.est=m;S.ready.est=true;render();if(S.sheet)renderSheet();},err);
  db.collection("itens").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]={...d.data(),id:d.id});S.itens=m;S.ready.it=true;render();if(S.sheet&&!document.querySelector(".sheet input:focus,.sheet select:focus"))renderSheet();},err);
  db.collection("movs").orderBy("t","desc").limit(200).onSnapshot(sn=>{S.movs=sn.docs.map(d=>d.data());if(S.view==="home")render();},()=>{});
  db.collection("config").onSnapshot(sn=>{const d=sn.docs.find(x=>x.id==="planilha");S.plan=d?d.data():null;if(S.view==="config")render();if(S.plan)PLAN.flush();},()=>{});
  db.collection("papeis").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=d.data());S.papeis=m;S.ready.pap=true;render();},err);
  if(S.me.owner){db.collection("pedidos").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=d.data());S.pedidos=m;render();},()=>{});}
  else if(S.me.id){
    try{const p=await db.doc("papeis/"+S.me.id).get();
      if(!p.exists){const r=db.doc("pedidos/"+S.me.id);const g=await r.get();if(!g.exists)await r.set({em:Date.now()});S.pedidoFeito=true;}
    }catch(e){S.pedidoFeito=false;}
    render();
  }
}
if(window.claude)boot();else addEventListener("claude-ready",boot,{once:true});
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
